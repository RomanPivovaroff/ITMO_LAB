# ============================================================
# build.properties — параметры сборки проекта
# Лабораторная работа №3, Веб-программирование
# ============================================================

# Метаданные проекта
project.name=WebLab3
project.version=1.0.0
project.vendor=Roman P.

# Структура директорий
dir.src=src/main/java
dir.resources=src/main/resources
dir.webapp=src/main/webapp
dir.build=build
dir.classes=${dir.build}/classes
dir.dist=dist
dir.lib=lib
dir.test.src=src/test/java
dir.test.classes=${dir.build}/test-classes
dir.test.reports=${dir.build}/test-reports
dir.javadoc=${dir.build}/javadoc
dir.alt=alt
dir.alt.src=${dir.alt}/src
dir.alt.classes=${dir.alt}/classes
dir.alt.dist=${dir.alt}/dist
dir.i18n.ascii=${dir.build}/i18n-ascii

# Артефакты
war.name=${project.name}-${project.version}.war
war.path=${dir.dist}/${war.name}
war.alt.name=${project.name}-alt-${project.version}.war
war.alt.path=${dir.alt.dist}/${war.alt.name}
zip.team.name=${project.name}-team-builds.zip
zip.team.path=${dir.dist}/${zip.team.name}

# Компиляция
javac.source=17
javac.target=17
javac.encoding=UTF-8
javac.debug=true

# Зависимости 
lib.compile=${dir.lib}/compile
lib.runtime=${dir.lib}/runtime
lib.test=lib/test

# Манифест
manifest.vendor=${project.vendor}
manifest.title=${project.name}
manifest.version=${project.version}

# JUnit
junit.haltonerror=false
junit.haltonfailure=false
junit.fork=true

# Git
git.executable=git
git.branch=master
git.commit.message=Auto-commit: JUnit report [Ant]

# SVN
svn.executable=svn
svn.url=file:///C:/svn-repos/weblab3/trunk
# Классы, изменения которых НЕ блокируют SVN-коммит (через пробел)
svn.excluded.classes=app.backend.service.PointLogicService

# Музыка
music.file=resources/success.wav

# SCP
scp.host=your.server.com
scp.port=22
scp.user=deploy
scp.remotedir=/opt/weblab3/deploy
scp.keyfile=${user.home}/.ssh/id_rsa

# alt: замена имён (replaceregexp)
alt.replace.from.class=InputBean
alt.replace.to.class=FormBean
alt.replace.from.var=historyService
alt.replace.to.var=svcHistory

# env: альтернативные окружения
env.1.java=C:/Program Files/Java/jdk-17/bin/java
env.1.jvmargs=-Xmx256m -Dfile.encoding=UTF-8
env.2.java=C:/Program Files/Java/jdk-17/bin/java
env.2.jvmargs=-Xmx512m -Dfile.encoding=UTF-8

# team: количество предыдущих git-ревизий
team.revisions.count=4
